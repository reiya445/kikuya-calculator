<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>景品・換金計算ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif;
            background:
                linear-gradient(rgba(10, 30, 60, 0.18), rgba(10, 30, 60, 0.18)),
                url('./kikuya.png') center / cover fixed no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.92);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .rate-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .rate-btn {
            padding: 14px 0;
            font-size: 0.95rem;
            font-weight: 600;
            border: 2px solid #e0e6ed;
            background-color: #f8f9fb;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
        }

        .rate-btn:hover {
            border-color: #3498db;
            background-color: #ecf0f7;
        }

        .rate-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .input-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.2rem;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 500;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="number"]::placeholder {
            color: #bbb;
        }

        .result-section {
            margin-top: 32px;
        }

        .result-title {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 16px;
            font-size: 1.1rem;
            padding-bottom: 12px;
            border-bottom: 3px solid #667eea;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 1rem;
            color: #555;
        }

        .result-row:last-of-type {
            border-bottom: none;
        }

        .result-row span:first-child {
            font-weight: 500;
        }

        .result-row span:last-child {
            font-weight: 600;
            color: #2c3e50;
        }

        .remainder-row {
            background-color: #f8f9fb;
            padding: 14px 12px;
            border-radius: 8px;
            margin: 12px 0;
        }

        .remainder-row span:last-child {
            color: #999;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            margin-top: 20px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 18px 16px;
        }

        .total-row span:last-child {
            font-size: 1.6rem;
        }

        /* レスポンシブ対応 */
        @media (max-width: 480px) {
            .container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 24px;
            }

            .rate-buttons {
                gap: 10px;
                margin-bottom: 24px;
            }

            .rate-btn {
                font-size: 0.85rem;
                padding: 12px 0;
            }

            input[type="number"] {
                font-size: 1.1rem;
                padding: 12px 14px;
            }

            .total-row {
                font-size: 1.2rem;
            }

            .total-row span:last-child {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>景品・換金 計算ツール</h1>
    
    <div class="rate-buttons">
        <button class="rate-btn" onclick="selectRate('2S')">2S</button>
        <button class="rate-btn active" onclick="selectRate('5S')">5S</button>
        <button class="rate-btn" onclick="selectRate('20S')">20S</button>
        <button class="rate-btn" onclick="selectRate('4P')">4P</button>
        <button class="rate-btn" onclick="selectRate('1P')">1P</button>
    </div>

    <div class="input-group">
        <label id="input-label">5Sの枚数を入力：</label>
        <input type="number" id="amount-input" placeholder="数値を入力" oninput="calculate()">
    </div>

    <div class="result-section">
        <div class="result-title">計算結果</div>
        <div class="result-row">
            <span>大景品 (4,900円)</span>
            <span id="res-large">0 個</span>
        </div>
        <div class="result-row">
            <span>中景品 (980円)</span>
            <span id="res-medium">0 個</span>
        </div>
        <div class="result-row">
            <span>小景品 (190円)</span>
            <span id="res-small">0 個</span>
        </div>
        <div class="result-row remainder-row">
            <span>最終的な余り</span>
            <span id="res-rem">0 枚</span>
        </div>
        <div class="total-row">
            <span>換金合計額</span>
            <span id="res-total">0 円</span>
        </div>
    </div>
</div>

<script>
    // 各レートの条件（大、中、小に必要な枚数・玉数）
    const rateSettings = {
        '5S':  { unit: '枚', large: 1023, medium: 205, small: 41 },
        '2S':  { unit: '枚', large: 2750, medium: 550, small: 110 },
        '20S': { unit: '枚', large: 253,  medium: 51,  small: 11 },
        '4P':  { unit: '玉', large: 1250, medium: 250, small: 50 },
        '1P':  { unit: '玉', large: 5000, medium: 1000, small: 200 }
    };

    // 景品の金額設定
    const prices = { large: 4900, medium: 980, small: 190 };

    // 初期状態は5S
    let currentRate = '5S';

    // ボタンが押された時の切り替え処理
    function selectRate(rate) {
        currentRate = rate;
        
        // ボタンの「アクティブ状態」の見た目を切り替える
        document.querySelectorAll('.rate-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText === rate) btn.classList.add('active');
        });

        // 入力欄のラベル（単位）を自動で切り替える
        const unit = rateSettings[rate].unit;
        document.getElementById('input-label').innerText = `${rate}の${unit}数を入力：`;
        
        // レートを切り替えたら、その場で再計算する
        calculate();
    }

    // あなたのロジック通りの計算メイン処理
    function calculate() {
        // 入力された数値を取得（空っぽなら0にする）
        const inputVal = parseInt(document.getElementById('amount-input').value) || 0;
        const config = rateSettings[currentRate];
        
        let remaining = inputVal;

        // 【1】大景品の計算
        // 商（個数）を出す
        const numLarge = Math.floor(remaining / config.large);
        // 余りを次の計算にまわす
        remaining = remaining % config.large;

        // 【2】中景品の計算
        // 前の余りを、さらに中で割って商（個数）を出す
        const numMedium = Math.floor(remaining / config.medium);
        // さらに出た余りを次にまわす
        remaining = remaining % config.medium;

        // 【3】小景品の計算
        // 前の余りを、さらに小で割って商（個数）を出す
        const numSmall = Math.floor(remaining / config.small);
        // 最後に残ったものが「最終的な余り」
        remaining = remaining % config.small;

        // 【4】金額の合計を計算
        const totalCash = (numLarge * prices.large) + (numMedium * prices.medium) + (numSmall * prices.small);

        // 各結果を画面に見やすく表示（3桁カンマ区切り）
        document.getElementById('res-large').innerText = `${numLarge.toLocaleString()} 個`;
        document.getElementById('res-medium').innerText = `${numMedium.toLocaleString()} 個`;
        document.getElementById('res-small').innerText = `${numSmall.toLocaleString()} 個`;
        document.getElementById('res-rem').innerText = `${remaining.toLocaleString()} ${config.unit}`;
        document.getElementById('res-total').innerText = `${totalCash.toLocaleString()} 円`;
    }
</script>

</body>
</html>
